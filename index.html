<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scan Line Instrument</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #060608;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    color: #fff;
  }
  body { position: fixed; inset: 0; }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Start Screen ── */
  #start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 32px;
  }
  #start-screen .line {
    width: 2px;
    height: 100px;
    background: linear-gradient(to bottom, transparent, rgba(255,0,255,0.8), transparent);
  }
  #start-screen h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
  #start-screen .sub {
    color: rgba(255, 200, 255, 0.45);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #start-screen .desc {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    line-height: 1.8;
    text-align: center;
    max-width: 320px;
  }
  .btn {
    background: rgba(255, 0, 255, 0.1);
    border: 1px solid rgba(255, 0, 255, 0.4);
    border-radius: 12px;
    color: #fff;
    padding: 14px 44px;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .btn:active { background: rgba(255, 0, 255, 0.25); }
  .btn-stop {
    position: absolute;
    bottom: max(28px, env(safe-area-inset-bottom, 28px));
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 32px;
    font-size: 13px;
    border-radius: 8px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 30;
  }

  /* ── Camera / Running ── */
  #camera-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #process-canvas { display: none; }
  #video-el {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px;
    height: 1px;
  }

  /* ── Overlay elements ── */
  .overlay { position: absolute; pointer-events: none; }

  #safe-zone {
    left: 0; right: 0;
    background: rgba(255, 0, 255, 0.04);
    border-top: 1px solid rgba(255, 0, 255, 0.15);
    border-bottom: 1px solid rgba(255, 0, 255, 0.15);
  }
  #horizon-line {
    left: 0; right: 0;
    height: 1px;
    background: rgba(255, 180, 0, 0.5);
  }
  #scan-line {
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(255, 0, 255, 0.7);
    box-shadow: 0 0 12px rgba(255, 0, 255, 0.5), 0 0 30px rgba(255, 0, 255, 0.2);
    z-index: 10;
  }
  #note-indicators {
    top: 0; bottom: 0;
    width: 70px;
    z-index: 10;
  }
  .note-row {
    position: absolute;
    left: 0;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0.2;
    transition: opacity 0.12s;
  }
  .note-bar {
    min-width: 2px;
    min-height: 2px;
    border-radius: 2px;
    transition: width 0.08s, height 0.08s, background 0.08s, box-shadow 0.15s;
  }
  .note-label {
    font-size: 9px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: rgba(255, 200, 255, 0.3);
    transition: color 0.12s;
  }
  #label-top {
    top: max(12px, env(safe-area-inset-top, 12px));
    left: 12px;
    color: rgba(255, 200, 255, 0.6);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 10;
  }
  #label-safe {
    right: 12px;
    color: rgba(255, 180, 0, 0.4);
    font-size: 9px;
    letter-spacing: 1px;
  }

  /* Hidden when not running */
  .running-only { display: none; }
  body.running .running-only { display: block; }
  body.running #start-screen { display: none; }

  #error-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px;
    text-align: center;
  }
  #error-screen .err-msg {
    color: rgba(255, 100, 100, 0.8);
    font-size: 13px;
  }
  #error-screen .err-hint {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    max-width: 300px;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div id="app">
  <video id="video-el" playsinline muted></video>
  <canvas id="process-canvas"></canvas>
  <canvas id="camera-canvas" class="running-only"></canvas>

  <!-- Overlays -->
  <div id="safe-zone" class="overlay running-only"></div>
  <div id="horizon-line" class="overlay running-only"></div>
  <div id="scan-line" class="overlay running-only"></div>
  <div id="note-indicators" class="overlay running-only"></div>
  <div id="label-top" class="overlay running-only">scan line instrument</div>
  <div id="label-safe" class="overlay running-only">safe zone ▾</div>
  <button class="btn btn-stop running-only" id="stop-btn">■&ensp;stop</button>

  <div id="start-screen">
    <div class="line"></div>
    <h1>Scan Line</h1>
    <p class="sub">camera → light → sound</p>
    <p class="desc">
      Point your rear camera at a scene. Walk or pan slowly.
      Objects crossing the scan line become music.
    </p>
    <button class="btn" id="start-btn" style="margin-top:12px">▶&ensp;begin</button>
  </div>

  <div id="error-screen">
    <p class="err-msg" id="err-msg"></p>
    <p class="err-hint">Camera access is required. Make sure you're opening this file directly in Safari — not inside an app's built-in browser.</p>
    <button class="btn" id="back-btn" style="padding:8px 24px;font-size:12px">back</button>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────
const SCALE_NOTES = [
  { note: "Bb2", freq: 116.54 },
  { note: "C3",  freq: 130.81 },
  { note: "D3",  freq: 146.83 },
  { note: "F3",  freq: 174.61 },
  { note: "G3",  freq: 196.00 },
  { note: "Bb3", freq: 233.08 },
  { note: "C4",  freq: 261.63 },
  { note: "D4",  freq: 293.66 },
  { note: "F4",  freq: 349.23 },
  { note: "G4",  freq: 392.00 },
  { note: "Bb4", freq: 466.16 },
  { note: "C5",  freq: 523.25 },
];

const DRONE_BASE = 87.31;    // F2
const SCAN_X = 0.62;
const SAFE_TOP = 0.30;
const SAFE_BOT = 0.70;
const PW = 320, PH = 240;
const HORIZON_SMOOTH = 0.92;
const BG_RATE = 0.005;
const ENERGY_THRESH = 12;
const NOTE_ATTACK = 0.08;
const NOTE_RELEASE = 0.6;
const ENERGY_SMOOTH_UP = 0.75;
const ENERGY_SMOOTH_DN = 0.92;

// ── State ──────────────────────────────────────────────────────
let audio = null;
let stream = null;
let raf = null;
let bgModel = [];
let smoothHorizon = 0.5;
let smoothEnergies = new Array(SCALE_NOTES.length).fill(0);

// ── DOM refs ───────────────────────────────────────────────────
const videoEl = document.getElementById("video-el");
const procCanvas = document.getElementById("process-canvas");
const camCanvas = document.getElementById("camera-canvas");
const safezone = document.getElementById("safe-zone");
const horizonLine = document.getElementById("horizon-line");
const scanLine = document.getElementById("scan-line");
const noteContainer = document.getElementById("note-indicators");
const labelSafe = document.getElementById("label-safe");

procCanvas.width = PW;
procCanvas.height = PH;
const pCtx = procCanvas.getContext("2d", { willReadFrequently: true });
const camCtx = camCanvas.getContext("2d");

// ── Position overlays ──────────────────────────────────────────
function layoutOverlays() {
  safezone.style.top = (SAFE_TOP * 100) + "%";
  safezone.style.height = ((SAFE_BOT - SAFE_TOP) * 100) + "%";
  scanLine.style.left = (SCAN_X * 100) + "%";
  noteContainer.style.left = "calc(" + (SCAN_X * 100) + "% + 8px)";
  labelSafe.style.top = "calc(" + (SAFE_TOP * 100) + "% - 16px)";
}
layoutOverlays();

// Build note indicator DOM
const noteRows = SCALE_NOTES.map((n, i) => {
  const row = document.createElement("div");
  row.className = "note-row";
  const y = (1 - (i + 0.5) / SCALE_NOTES.length) * 100;
  row.style.top = y + "%";

  const bar = document.createElement("div");
  bar.className = "note-bar";
  row.appendChild(bar);

  const label = document.createElement("span");
  label.className = "note-label";
  label.textContent = n.note;
  row.appendChild(label);

  noteContainer.appendChild(row);
  return { row, bar, label };
});

// ── Audio Builder ──────────────────────────────────────────────
function makeReverb(ctx, dur, decay) {
  const len = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

function buildAudio() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 12;
  comp.ratio.value = 6;
  comp.attack.value = 0.003;
  comp.release.value = 0.15;
  comp.connect(ctx.destination);

  const master = ctx.createGain();
  master.gain.value = 0.75;
  master.connect(comp);

  const convolver = ctx.createConvolver();
  convolver.buffer = makeReverb(ctx, 2.8, 2.2);
  const reverbSend = ctx.createGain();
  reverbSend.gain.value = 0.35;
  convolver.connect(reverbSend);
  reverbSend.connect(master);

  const dry = ctx.createGain();
  dry.gain.value = 0.65;
  dry.connect(master);

  // Drone
  const droneGain = ctx.createGain();
  droneGain.gain.value = 0.0;
  const droneFilter = ctx.createBiquadFilter();
  droneFilter.type = "lowpass";
  droneFilter.frequency.value = 500;
  droneFilter.Q.value = 0.8;

  const drones = [0, 3, -3].map(det => {
    const o = ctx.createOscillator();
    o.type = "triangle";
    o.frequency.value = DRONE_BASE;
    o.detune.value = det;
    o.connect(droneGain);
    o.start();
    return o;
  });

  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  lfo.frequency.value = 0.12;
  const lfoDepth = ctx.createGain();
  lfoDepth.gain.value = 180;
  lfo.connect(lfoDepth);
  lfoDepth.connect(droneFilter.frequency);
  lfo.start();

  droneGain.connect(droneFilter);
  droneFilter.connect(dry);
  droneFilter.connect(convolver);
  droneGain.gain.setTargetAtTime(0.14, ctx.currentTime + 0.1, 0.8);

  // Voices
  const voices = SCALE_NOTES.map(({ freq }) => {
    const osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;

    const shimmer = ctx.createOscillator();
    shimmer.type = "sine";
    shimmer.frequency.value = freq * 2;
    const shimVol = ctx.createGain();
    shimVol.gain.value = 0.12;
    shimmer.connect(shimVol);

    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = Math.min(freq * 5, 5000);
    filter.Q.value = 0.5;

    osc.connect(gain);
    shimVol.connect(gain);
    gain.connect(filter);
    filter.connect(dry);
    filter.connect(convolver);
    osc.start();
    shimmer.start();

    return { osc, shimmer, gain, filter, energy: 0 };
  });

  return { ctx, drones, droneGain, droneFilter, lfo, voices, dry, convolver };
}

// ── Vision ─────────────────────────────────────────────────────
function lum(r, g, b) { return 0.299 * r + 0.587 * g + 0.114 * b; }

function detectHorizon(data, w, h) {
  const d = data.data;
  const top = Math.floor(h * SAFE_TOP);
  const bot = Math.floor(h * SAFE_BOT);
  const step = Math.max(1, Math.floor(w / 40));
  const rowLum = [];

  for (let y = top; y < bot; y++) {
    let s = 0, c = 0;
    for (let x = 0; x < w; x += step) {
      const i = (y * w + x) * 4;
      s += lum(d[i], d[i+1], d[i+2]);
      c++;
    }
    rowLum.push(s / c);
  }

  let maxG = 0, hRow = Math.floor((top + bot) / 2);
  for (let i = 1; i < rowLum.length; i++) {
    const g = Math.abs(rowLum[i] - rowLum[i-1]);
    if (g > maxG) { maxG = g; hRow = top + i; }
  }
  return hRow / h;
}

function sampleColumn(data, w, h, xRat, nZones) {
  const d = data.data;
  const x = Math.floor(w * xRat);
  const zH = h / nZones;
  const energies = [];

  for (let z = 0; z < nZones; z++) {
    const yS = Math.floor(z * zH);
    const yE = Math.floor((z + 1) * zH);
    let s = 0, sq = 0, c = 0;

    for (let y = yS; y < yE && y < h; y++) {
      const i = (y * w + x) * 4;
      const l = lum(d[i], d[i+1], d[i+2]);
      s += l; sq += l * l; c++;
    }

    const mean = s / c;
    const std = Math.sqrt(Math.max(0, sq / c - mean * mean));
    const bgDiff = Math.abs(mean - (bgModel[z] ?? mean));
    bgModel[z] = bgModel[z] == null ? mean : bgModel[z] * (1 - BG_RATE) + mean * BG_RATE;

    energies.push(Math.max(0, std * 0.6 + bgDiff * 0.8 - ENERGY_THRESH));
  }
  return energies;
}

// ── Frame Loop ─────────────────────────────────────────────────
function loop() {
  if (!audio) return;
  const video = videoEl;

  // Draw to processing canvas
  pCtx.drawImage(video, 0, 0, PW, PH);
  const imgData = pCtx.getImageData(0, 0, PW, PH);

  // Draw to visible canvas (cover-fit)
  const cw = camCanvas.width, ch = camCanvas.height;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw && vh) {
    const scale = Math.max(cw / vw, ch / vh);
    const sw = cw / scale, sh = ch / scale;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    camCtx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
  }

  // Horizon
  const rawH = detectHorizon(imgData, PW, PH);
  smoothHorizon = smoothHorizon * HORIZON_SMOOTH + rawH * (1 - HORIZON_SMOOTH);

  // Scan column
  const rawE = sampleColumn(imgData, PW, PH, SCAN_X, SCALE_NOTES.length);
  // Invert: top of image → highest note
  const mapped = rawE.map((_, i) => rawE[SCALE_NOTES.length - 1 - i]);

  // Smooth
  smoothEnergies = smoothEnergies.map((prev, i) => {
    const t = mapped[i] || 0;
    return t > prev
      ? prev * ENERGY_SMOOTH_UP + t * (1 - ENERGY_SMOOTH_UP)
      : prev * ENERGY_SMOOTH_DN + t * (1 - ENERGY_SMOOTH_DN);
  });

  // Normalize
  const maxE = Math.max(...smoothEnergies, 1);
  const norm = smoothEnergies.map(e => Math.min(1, e / Math.max(maxE * 0.6, 30)));

  // Audio update
  const now = audio.ctx.currentTime;
  const hOffset = (smoothHorizon - 0.5) * 0.15;
  const dPitch = DRONE_BASE * (1 - hOffset);
  audio.drones.forEach(o => o.frequency.setTargetAtTime(dPitch + o.detune.value * 0.5, now, 0.3));

  audio.voices.forEach((v, i) => {
    const tg = norm[i] * 0.22;
    const tc = tg > v.energy ? NOTE_ATTACK : NOTE_RELEASE;
    v.gain.gain.setTargetAtTime(tg, now, tc);
    v.energy = tg;
  });

  // Visual update
  horizonLine.style.top = (smoothHorizon * 100) + "%";

  for (let i = 0; i < SCALE_NOTES.length; i++) {
    const e = norm[i];
    const nr = noteRows[i];
    nr.row.style.opacity = e > 0.02 ? 1 : 0.2;
    nr.bar.style.width = Math.max(2, e * 44) + "px";
    nr.bar.style.height = Math.max(2, 4 + e * 10) + "px";
    const r = 255, g = Math.floor(100 + e * 155), b = Math.floor(200 - e * 200);
    const a = (0.3 + e * 0.7).toFixed(2);
    nr.bar.style.background = `rgba(${r},${g},${b},${a})`;
    nr.bar.style.boxShadow = e > 0.3
      ? `0 0 ${(e * 12).toFixed(0)}px rgba(255,100,255,${(e * 0.5).toFixed(2)})`
      : "none";
    nr.label.style.color = `rgba(255,200,255,${(0.3 + e * 0.7).toFixed(2)})`;
  }

  raf = requestAnimationFrame(loop);
}

// ── Start / Stop ───────────────────────────────────────────────
async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });

    videoEl.srcObject = stream;
    await videoEl.play();

    // Size visible canvas
    function resizeCam() {
      camCanvas.width = window.innerWidth;
      camCanvas.height = window.innerHeight;
    }
    resizeCam();
    window.addEventListener("resize", resizeCam);

    audio = buildAudio();
    if (audio.ctx.state === "suspended") await audio.ctx.resume();

    bgModel = [];
    smoothHorizon = 0.5;
    smoothEnergies = new Array(SCALE_NOTES.length).fill(0);

    document.body.classList.add("running");
    raf = requestAnimationFrame(loop);

  } catch (err) {
    console.error(err);
    document.getElementById("err-msg").textContent = err.message || "Camera access denied";
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("error-screen").style.display = "flex";
  }
}

function stop() {
  if (raf) cancelAnimationFrame(raf);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (audio) {
    audio.drones.forEach(o => { try { o.stop(); } catch(e){} });
    audio.lfo.stop();
    audio.voices.forEach(v => { try { v.osc.stop(); v.shimmer.stop(); } catch(e){} });
    audio.ctx.close();
    audio = null;
  }
  bgModel = [];
  document.body.classList.remove("running");
  document.getElementById("start-screen").style.display = "flex";
}

// ── Events ─────────────────────────────────────────────────────
document.getElementById("start-btn").addEventListener("click", start);
document.getElementById("stop-btn").addEventListener("click", stop);
document.getElementById("back-btn").addEventListener("click", () => {
  document.getElementById("error-screen").style.display = "none";
  document.getElementById("start-screen").style.display = "flex";
});

// Prevent iOS rubber-banding
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
